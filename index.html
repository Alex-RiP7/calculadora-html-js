<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora HTML + JS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Calculadora</h1>
        <div class="calculator">
            <div class="input-group">
                <label for="num1">Número 1</label>
                <input type="number" id="num1" step="any" placeholder="Ingresa el primer número">
            </div>
            <div class="input-group">
                <label for="num2">Número 2</label>
                <input type="number" id="num2" step="any" placeholder="Ingresa el segundo número">
            </div>
            <div class="input-group">
                <label for="resultado">Resultado</label>
                <input type="text" id="resultado" readonly placeholder="El resultado aparecerá aquí">
            </div>
            <div class="buttons">
                <button onclick="calcular('+')">+</button>
                <button onclick="calcular('-')">-</button>
                <button onclick="calcular('*')">×</button>
                <button onclick="calcular('/')">÷</button>
            </div>
            <button class="clear-btn" onclick="limpiar()">Limpiar</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
